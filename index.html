<!DOCTYPE html>
<html>
<head>
    <title>Happy Birthday 🎉</title>
    <style>
        body {
            background: linear-gradient(to right, #ff758c, #ff7eb3);
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
            padding-top: 100px;
        }
        h1 {
            font-size: 60px;
        }
        p {
            font-size: 24px;
        }
        .btn {
            background: white;
            color: #ff4e8a;
            padding: 15px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>🎂 Happy Birthday, [Name]! 🎉</h1>
    <p>Wishing you a day filled with love, laughter, and cake! 🥳</p>
    <a class="btn" href="#">Click for a Surprise 💝</a>
</body>
</html>
