<!DOCTYPE html>
<html>
<head>
    <title>Happy Birthday Januca 🎉</title>
    <style>
        body {
            margin: 0;
            text-align: center;
            font-family: Arial, sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        }

        h1 {
            margin-top: 30px;
            font-size: 40px;
        }

        #gameArea {
            position: relative;
            width: 100%;
            height: 60vh;
            background: rgba(255,255,255,0.2);
            overflow: hidden;
            margin-top: 20px;
        }

        .cake {
            position: absolute;
            font-size: 40px;
            cursor: pointer;
        }

        button {
            background: #ff4d6d;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 15px;
        }

        #score {
            font-size: 20px;
            margin-top: 10px;
        }

        #message {
            display: none;
            font-size: 22px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<h1>🎂 HAPPY BIRTHDAY JANUCA 🎉</h1>
<p>Catch the cakes before they disappear!</p>

<button onclick="startGame()">Start Birthday Game 🎮</button>
<div id="score">Score: 0</div>

<div id="gameArea"></div>

<div id="message">
    🎉 JANUCA WINS! 🎉  
    <br><br>
    Official title unlocked:
    <br>
    "Supreme Cake Destroyer 2026" 👑
</div>

<!-- 🎵 Birthday Music -->
<audio id="birthdaySong" loop>
    <source src="https://www2.cs.uic.edu/~i101/SoundFiles/HappyBirthday.mid" type="audio/midi">
</audio>

<script>
    let score = 0;
    let gameInterval;

    function startGame() {
        document.getElementById("birthdaySong").play().catch(()=>{});
        score = 0;
        document.getElementById("score").innerText = "Score: " + score;
        document.getElementById("message").style.display = "none";

        gameInterval = setInterval(spawnCake, 700);

        setTimeout(() => {
            clearInterval(gameInterval);
            document.getElementById("message").style.display = "block";
        }, 15000);
    }

    function spawnCake() {
        const cake = document.createElement("div");
        cake.classList.add("cake");
        cake.innerText = "🎂";
        cake.style.left = Math.random() * 90 + "vw";
        cake.style.top = Math.random() * 50 + "vh";

        cake.onclick = function() {
            score++;
            document.getElementById("score").innerText = "Score: " + score;
            cake.remove();
        };

        document.getElementById("gameArea").appendChild(cake);

        setTimeout(() => cake.remove(), 2000);
    }
</script>

</body>
</html>
