<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A birthday wish for Akshaya</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff3d6;--ink:#2a1650;--pink:#ff4f8b;--yellow:#ffc928;--mint:#2fd1a5;--cake:#ffd6e5;--plate:#2a1650;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1040;--ink:#fff3d6;--cake:#ffd6e5;--plate:#fff3d6}}
:root[data-theme="dark"]{--bg:#1d1040;--ink:#fff3d6;--cake:#ffd6e5;--plate:#fff3d6}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Fredoka",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;overflow-x:hidden}
main{width:100%;max-width:520px;padding:20px}
h1{font-size:clamp(2rem,9vw,3.4rem);margin:0 0 6px;line-height:1.05;min-height:2.2em}
h1 span{display:inline-block;animation:pop .6s cubic-bezier(.3,1.8,.5,1) both}
h1 b{display:inline-block;white-space:nowrap;font-weight:inherit}
@keyframes pop{from{transform:translateY(40px) scale(.3) rotate(-20deg);opacity:0}}
#sub{font-size:1.15rem;min-height:3.2em;margin:0 auto 12px;max-width:34ch}
label{display:block;font-size:1rem;margin-bottom:6px}
input{font:inherit;font-size:1.1rem;padding:10px 16px;border-radius:999px;border:3px solid var(--ink);background:transparent;color:var(--ink);text-align:center;width:min(260px,100%)}
input:focus-visible,button:focus-visible{outline:4px solid var(--mint);outline-offset:3px}
button{font:inherit;font-weight:700;font-size:1.15rem;margin-top:14px;padding:12px 28px;border:0;border-radius:999px;background:var(--pink);color:#fff;cursor:pointer;box-shadow:0 5px 0 #b3265c;transition:transform .1s,box-shadow .1s}
button:active{transform:translateY(4px);box-shadow:0 1px 0 #b3265c}
svg{width:min(280px,70vw);height:auto;display:block;margin:6px auto 0;overflow:visible}
.flame{transform-origin:50% 100%;transform-box:fill-box;animation:flick .35s ease-in-out infinite alternate;transition:opacity .25s,transform .25s}
.flame:nth-of-type(2){animation-delay:.12s}.flame:nth-of-type(3){animation-delay:.22s}
@keyframes flick{from{transform:scale(1,1) rotate(-4deg)}to{transform:scale(.88,1.15) rotate(4deg)}}
.out .flame{opacity:0;transform:scale(0);animation:none}
.smoke{opacity:0}
.out .smoke{animation:rise 1.6s ease-out}
@keyframes rise{0%{opacity:.7;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px)}}
.out #cake{animation:wob .6s ease-in-out}
@keyframes wob{25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
#cake{transform-origin:50% 100%;transform-box:fill-box}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
@media (prefers-reduced-motion:reduce){.flame,h1 span,.out #cake,.out .smoke{animation:none}}
</style>
</head>
<body>
<main id="app">
  <h1 id="title">Make a wish, Akshaya</h1>
  <p id="sub">Close your eyes, make a wish, then blow out the candles.</p>
  <svg id="scene" viewBox="0 0 200 190" role="img" aria-label="Birthday cake with three lit candles">
    <g id="cake">
      <rect x="20" y="110" width="160" height="60" rx="12" fill="var(--cake)"/>
      <path d="M20 122c14 14 24-6 40 4s26-8 40 2 26-10 40 0 26-6 40 2v-20H20z" fill="var(--pink)"/>
      <circle cx="50" cy="150" r="5" fill="var(--yellow)"/><circle cx="100" cy="153" r="5" fill="var(--mint)"/><circle cx="150" cy="150" r="5" fill="var(--yellow)"/>
      <rect x="10" y="168" width="180" height="10" rx="5" fill="var(--plate)"/>
      <rect x="56" y="76" width="10" height="34" rx="3" fill="var(--mint)"/>
      <rect x="95" y="70" width="10" height="40" rx="3" fill="var(--yellow)"/>
      <rect x="134" y="76" width="10" height="34" rx="3" fill="var(--mint)"/>
      <path class="flame" d="M61 52c9 10 7 20 0 24-7-4-9-14 0-24z" fill="#ff9a1f"/>
      <path class="flame" d="M100 46c9 10 7 20 0 24-7-4-9-14 0-24z" fill="#ff9a1f"/>
      <path class="flame" d="M139 52c9 10 7 20 0 24-7-4-9-14 0-24z" fill="#ff9a1f"/>
      <g class="smoke" stroke="var(--ink)" stroke-width="2" fill="none" stroke-linecap="round"><path d="M61 70c-6-8 6-12 0-20"/><path d="M100 64c-6-8 6-12 0-20"/><path d="M139 70c-6-8 6-12 0-20"/></g>
    </g>
  </svg>
  <div id="controls">
    <button id="go" type="button">Blow out the candles</button>
  </div>
</main>
<canvas id="fx" aria-hidden="true"></canvas>
<script>
(function(){
  var app=document.getElementById('app'),title=document.getElementById('title'),sub=document.getElementById('sub'),
      go=document.getElementById('go'),scene=document.getElementById('scene'),
      cv=document.getElementById('fx'),ctx=cv.getContext('2d'),parts=[],running=false,out=false,timer=null,
      calm=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var wishes=['May your year be full of cake, laughter, and zero Monday meetings.',
              'Another trip around the sun, and you made it look good.',
              'Hope today is packed with your favourite people and snacks.',
              'Here’s to big plans, small joys, and a wish that comes true.'];
  var colors=['#ff4f8b','#ffc928','#2fd1a5','#6c8cff','#ff9a1f'];
  function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}
  size();addEventListener('resize',size);
  function burst(){
    var n=calm?40:160,d=devicePixelRatio;
    for(var i=0;i<n;i++){
      var a=Math.random()*Math.PI*2,s=(6+Math.random()*10)*d;
      parts.push({x:cv.width/2,y:cv.height*.45,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6*d,w:(6+Math.random()*6)*d,h:(4+Math.random()*5)*d,
        r:Math.random()*6,vr:(Math.random()-.5)*.4,c:colors[i%colors.length]});
    }
    if(!running){running=true;requestAnimationFrame(tick)}
  }
  function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    parts=parts.filter(function(p){return p.y<cv.height+40});
    parts.forEach(function(p){
      p.vy+=.35*devicePixelRatio;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();
    });
    if(parts.length){requestAnimationFrame(tick)}else{running=false}
  }
  function type(text){
    clearInterval(timer);sub.textContent='';var i=0;
    timer=setInterval(function(){sub.textContent=text.slice(0,++i);if(i>=text.length)clearInterval(timer)},calm?0:35);
  }
  function setTitle(text){
    title.textContent='';
    var k=0;
    text.split(' ').forEach(function(word,w){
      var b=document.createElement('b');
      word.split('').forEach(function(ch){
        var s=document.createElement('span');s.textContent=ch;s.style.animationDelay=(k++*60)+'ms';b.appendChild(s);
      });
      if(w>0)title.appendChild(document.createTextNode(' '));
      title.appendChild(b);
    });
  }
  function blow(){
    out=true;scene.classList.add('out');
    setTitle('Happy Birthday, Akshaya!');
    type(wishes[Math.floor(Math.random()*wishes.length)]);
    burst();setTimeout(burst,500);setTimeout(burst,1100);
    go.textContent='Light them again';
  }
  function relight(){
    out=false;scene.classList.remove('out');
    title.textContent='Make a wish, Akshaya';sub.textContent='Close your eyes, then blow them out.';
    go.textContent='Blow out the candles';
  }
  go.addEventListener('click',function(){out?relight():blow()});
  scene.addEventListener('click',function(){if(!out)blow()});
})();
</script>
</body>
</html>
