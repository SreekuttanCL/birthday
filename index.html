<!DOCTYPE html>
<html>
<head>
    <title>Happy Birthday Januca 🎉</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            text-align: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: white;
        }

        h1 {
            margin-top: 60px;
            font-size: 45px;
        }

        #startBtn {
            background: black;
            color: #ff7eb3;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 20px;
        }

        #message {
            display: none;
            font-size: 22px;
            margin: 30px;
            animation: fadeIn 2s forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .balloon {
            position: absolute;
            bottom: -100px;
            font-size: 40px;
            animation: floatUp 8s linear infinite;
        }

        @keyframes floatUp {
            from { transform: translateY(0); }
            to { transform: translateY(-120vh); }
        }

        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            top: -10px;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(100vh); }
        }
    </style>
</head>

<body>

<h1>🎂 HAPPY BIRTHDAY JANUCA 🎂</h1>
<button id="startBtn">Start the Chaos 😈</button>

<div id="message">
    🔥 OFFICIAL ANNOUNCEMENT 🔥 <br><br>
    Januca has leveled up again. <br>
    More wrinkles? Maybe. <br>
    More wisdom? Debatable. <br><br>
    But one thing is certain… <br><br>
    You are still the funniest, most chaotic legend I know. 😂 <br><br>
    Stay iconic. Stay dramatic. Stay JANUCA. 💛
</div>

<!-- 🎵 Royalty-Free Happy Birthday Music -->
<audio id="birthdaySong">
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3?filename=happy-birthday-to-you-10901.mp3" type="audio/mpeg">
</audio>

<script>
const btn = document.getElementById("startBtn");
const message = document.getElementById("message");
const song = document.getElementById("birthdaySong");

btn.addEventListener("click", () => {
    song.play();
    message.style.display = "block";
    btn.style.display = "none";

    launchConfetti();
    launchBalloons();
});

function launchConfetti() {
    for (let i = 0; i < 150; i++) {
        const confetti = document.createElement("div");
        confetti.classList.add("confetti");
        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.backgroundColor =
            ["#ff4d6d","#ffd166","#06d6a0","#118ab2","#ffffff"]
            [Math.floor(Math.random()*5)];
        confetti.style.animationDuration = (Math.random() * 3 + 2) + "s";
        document.body.appendChild(confetti);

        setTimeout(() => confetti.remove(), 5000);
    }
}

function launchBalloons() {
    setInterval(() => {
        const balloon = document.createElement("div");
        balloon.classList.add("balloon");
        balloon.innerText = ["🎈","🎉","🎊"][Math.floor(Math.random()*3)];
        balloon.style.left = Math.random() * 100 + "vw";
        balloon.style.animationDuration = (Math.random() * 5 + 5) + "s";
        document.body.appendChild(balloon);

        setTimeout(() => balloon.remove(), 8000);
    }, 800);
}
</script>

</body>
</html>
